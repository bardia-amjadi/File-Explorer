name: Build release APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish a GitHub Release (needs a version tag such as v1.0.0 selected as the ref)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write   # only used when publishing a GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - uses: gradle/actions/wrapper-validation@v4

      - run: chmod +x ./gradlew

      - name: Decode signing keystore (only if secrets are configured)
        id: signing
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured: building an UNSIGNED release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the artifact
        id: name
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "artifact=File-Explorer-release-apk" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=File-Explorer-release-apk-UNSIGNED" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ (startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || inputs.publish) }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.signed == 'true' && 'Signed release build.' || 'UNSIGNED release build: Android will not install it until it is signed.' }}
